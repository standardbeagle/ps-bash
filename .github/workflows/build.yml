name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.dartai/**'
      - '.dartai-locks.json'
      - 'docs/spikes/**'
      - 'docs/solutions/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.dartai/**'
      - '.dartai-locks.json'
      - 'docs/spikes/**'
      - 'docs/solutions/**'
      - '**/*.md'

# Cancel earlier runs on the same ref/PR when new commits arrive.
# Avoids wasting CI minutes on superseded loop bookkeeping commits.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: ps-bash.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: ps-bash
          - os: macos-latest
            rid: osx-arm64
            binary: ps-bash

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Catch host compilation failures on PRs. The solution-wide build above
      # already covers PsBash.Host transitively, but an explicit step makes the
      # failure obvious in the PR check log when host code regresses.
      - name: Build PsBash.Host
        run: dotnet build src/PsBash.Host --no-restore -c Release

      # --blame-hang-timeout kills the test runner after a hung test (5m) and
      # dumps the offender — surfaces hangs as a real failure instead of
      # silently consuming the 6h job timeout. timeout-minutes is a backstop.
      #
      # PsBash.Differential.Tests is currently quarantined on Linux + macOS:
      # the Oracle/Seed/Redirection suites hang indefinitely on the first
      # `Process.Start(ps-bash)` even though the launcher works fine when
      # invoked directly from a shell. Repros locally on WSL2 (Ubuntu .NET
      # 10.0.0-rc.2) — every Oracle-style test with non-trivial stdout
      # (`echo hello`, `echo 'hello world'`) sits in WaitForExitAsync until
      # killed, while `exit 0` passes in 138ms. Hypothesis: stdin/stdout
      # pipe redirection interacts badly with ps-bash-host daemon under
      # certain workloads. Tracked as a P0 bug; Windows still runs the suite
      # so we keep coverage for transpiler / runtime parity until the hang
      # is rooted out.
      # Linux + macOS run every test project EXCEPT PsBash.Differential.Tests
      # (test-discovery static init alone is enough to deadlock on these OSes).
      # Windows runs the whole solution so transpile/runtime parity coverage
      # is preserved while the hang is investigated.
      - name: Unit tests
        timeout-minutes: 20
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            dotnet test --no-build -c Release --filter "Category!=Integration" --blame-hang-timeout 5m --blame-hang-dump-type none
          else
            set +e
            STATUS=0
            for proj in PsBash.Core.Tests PsBash.Cmdlets.Tests PsBash.Escalation.Tests PsBash.Shell.Tests PsBash.Host.Tests; do
              echo "::group::$proj"
              dotnet test --no-build -c Release "src/$proj" --filter "Category!=Integration" --blame-hang-timeout 5m --blame-hang-dump-type none
              rc=$?
              echo "::endgroup::"
              [ $rc -ne 0 ] && STATUS=$rc
            done
            exit $STATUS
          fi

      - name: Integration tests
        timeout-minutes: 20
        continue-on-error: true
        run: dotnet test --no-build -c Release --filter "Category=Integration" --blame-hang-timeout 5m --blame-hang-dump-type none

      # /warnaserror gates AOT regressions on PRs (matches publish.yml). Any
      # new trimming/reflection warning fails the build instead of leaking
      # to the next release.
      - name: Publish AOT launcher
        run: dotnet publish src/PsBash.Shell -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true /warnaserror -c Release -o dist/${{ matrix.rid }}

      # Host is non-AOT — publish self-contained so all SDK runtime assets are present.
      - name: Publish ps-bash-host
        run: dotnet publish src/PsBash.Host -r ${{ matrix.rid }} --self-contained true -c Release -o dist/host/${{ matrix.rid }}

      - name: Package slim
        shell: pwsh
        run: ./scripts/package-slim.ps1 -RID ${{ matrix.rid }}

      - name: Package full
        shell: pwsh
        run: ./scripts/package-full.ps1 -RID ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ps-bash-slim-${{ matrix.rid }}
          path: dist/slim/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ps-bash-full-${{ matrix.rid }}
          path: dist/full/${{ matrix.rid }}
