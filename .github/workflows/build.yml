name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.dartai/**'
      - '.dartai-locks.json'
      - 'docs/spikes/**'
      - 'docs/solutions/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.dartai/**'
      - '.dartai-locks.json'
      - 'docs/spikes/**'
      - 'docs/solutions/**'
      - '**/*.md'

# Cancel earlier runs on the same ref/PR when new commits arrive.
# Avoids wasting CI minutes on superseded loop bookkeeping commits.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: ps-bash.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: ps-bash
          - os: macos-latest
            rid: osx-arm64
            binary: ps-bash
            # macOS arm64: ps-bash launcher SIGABRTs at startup (exit 134)
            # under the arm64 runners. 239 cascade failures drown the
            # Windows/Linux signal. Soft-fail until #29 ships a fix.
            allow-failure: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Catch host compilation failures on PRs. The solution-wide build above
      # already covers PsBash.Host transitively, but an explicit step makes the
      # failure obvious in the PR check log when host code regresses.
      - name: Build PsBash.Host
        run: dotnet build src/PsBash.Host --no-restore -c Release

      # Windows-only: Differential tests use scripts that hardcode /tmp/...
      # paths (idiomatic bash). The transpiler's path translation kicks in for
      # command operands and redirect targets but not inside variable
      # assignments (e.g. `tmpf="/tmp/foo_$$"`), so the literal path leaks
      # through. On Windows runners that path resolves to D:\tmp\... or
      # C:\tmp\... which don't exist, and write redirects fail with "Could
      # not find a part of the path". Pre-create the dirs as a low-cost CI
      # fixup until the emitter is taught to translate /tmp in assignments.
      # See task #26.
      - name: Ensure /tmp exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tmp | Out-Null
          New-Item -ItemType Directory -Force -Path D:\tmp -ErrorAction SilentlyContinue | Out-Null

      # Gate the build on the deterministic suite (parser/emitter unit tests).
      # --blame-hang-timeout surfaces a hang as a failure; timeout-minutes backstops.
      - name: Unit tests — deterministic (gates the build)
        timeout-minutes: 15
        run: dotnet test src/PsBash.Core.Tests/PsBash.Core.Tests.csproj --no-build -c Release --blame-hang-timeout 180s --blame-hang-dump-type none

      # Full xUnit suite for visibility — NON-BLOCKING. The Differential suite
      # needs a bash oracle that GitHub runners lack (even `echo hello` fails),
      # the Shell/PTY suite needs TTY primitives (setsid) they lack, and a Cmdlets
      # test intermittently hangs. These fail/flake on CI but pass locally via
      # ./scripts/test.sh, so they must not gate the build. (Mirrors publish.yml.)
      - name: Unit tests — full suite (non-blocking, visibility)
        continue-on-error: true
        timeout-minutes: 20
        run: dotnet test --no-build -c Release --filter "Category!=Integration" --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Integration tests
        timeout-minutes: 20
        continue-on-error: true
        run: dotnet test --no-build -c Release --filter "Category=Integration" --blame-hang-timeout 5m --blame-hang-dump-type none

      # /warnaserror gates AOT regressions on PRs (matches publish.yml). Any
      # new trimming/reflection warning fails the build instead of leaking
      # to the next release.
      - name: Publish AOT launcher
        run: dotnet publish src/PsBash.Shell -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true /warnaserror -c Release -o dist/${{ matrix.rid }}

      # Host is non-AOT — publish self-contained so all SDK runtime assets are present.
      - name: Publish ps-bash-host
        run: dotnet publish src/PsBash.Host -r ${{ matrix.rid }} --self-contained true -c Release -o dist/host/${{ matrix.rid }}

      - name: Package slim
        shell: pwsh
        run: ./scripts/package-slim.ps1 -RID ${{ matrix.rid }}

      - name: Package full
        shell: pwsh
        run: ./scripts/package-full.ps1 -RID ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ps-bash-slim-${{ matrix.rid }}
          path: dist/slim/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ps-bash-full-${{ matrix.rid }}
          path: dist/full/${{ matrix.rid }}
