name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.dartai/**'
      - '.dartai-locks.json'
      - 'docs/spikes/**'
      - 'docs/solutions/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.dartai/**'
      - '.dartai-locks.json'
      - 'docs/spikes/**'
      - 'docs/solutions/**'
      - '**/*.md'

# Cancel earlier runs on the same ref/PR when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build PsBash.Cmdlets binary module
        shell: pwsh
        run: |
          # The psm1 probes well-known relative paths for PsBash.Cmdlets.dll
          # so Import-Module PsBash can load the binary cmdlets that many
          # Invoke-Bash* names now resolve to (REFACTOR-2 migrations).
          dotnet build src/PsBash.Cmdlets/PsBash.Cmdlets.csproj -c Debug --framework net8.0 -nologo
          # Copy the built dll next to PsBash.psd1 so the first probe path
          # (sibling of the manifest) succeeds without depending on bin/ layout.
          $dll = Get-ChildItem -Path src/PsBash.Cmdlets/bin -Filter PsBash.Cmdlets.dll -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'net8\.0' } |
                 Select-Object -First 1
          if (-not $dll) { throw "PsBash.Cmdlets.dll not found under src/PsBash.Cmdlets/bin after build" }
          Copy-Item $dll.FullName src/PsBash.Module/PsBash.Cmdlets.dll -Force
          Write-Host "Staged $($dll.FullName) -> src/PsBash.Module/PsBash.Cmdlets.dll"

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Run Pester Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
