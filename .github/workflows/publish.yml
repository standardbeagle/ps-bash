name: Publish Release

# Trait policy (Directive 5):
# Every [Fact] that is platform-locked MUST declare:
#   [Trait("Platform", "Windows")] (or "Linux" / "macOS")
#   [SkippableFact] with a reason on other platforms
# Tests that skip without a recognized reason fail the skip-report step.
# Recognized reasons: see scripts/skip-report.sh ALLOW_LIST.

on:
  # A pushed v* tag is the standard deploy; a manual dispatch re-runs an EXISTING tag.
  # Nothing is public until the final `release` job: binaries are built and tested as
  # workflow artifacts first, then promoted together. (A hand-published release trigger
  # is deliberately absent: that release is public before any gate has run.)
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag version to (re)publish (e.g. 0.1.0); built from that tag'
        required: true
      dry_run:
        description: 'Build, test and stage only: publish nothing (no GitHub release, PSGallery or NuGet)'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # One place decides the release tag every later job uses, and makes sure the
  # GitHub release exists before binaries are uploaded to it. A release created
  # here with GITHUB_TOKEN does not re-trigger the release event, so a tag push
  # runs this workflow once.
  release-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      # Resolve ONE immutable commit for the tag. Every later job checks out this SHA,
      # so a dispatch from another branch can never label that branch's source as the
      # requested version, and a nonexistent tag fails before anything is built.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then tag="$REF_NAME"; else tag="v${INPUT_VERSION#v}"; fi
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::'$tag' is not a vX.Y.Z tag"; exit 1 ;; esac
          if [ "$EVENT" != push ] && [ "$DRY_RUN" = true ]; then
            # Rehearsal: build and test the commit this run was dispatched from (the branch
            # under test), labelled with the requested version. Nothing is published.
            sha="$DISPATCH_SHA"
          elif ! sha=$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}"); then
            echo "::error::tag $tag does not exist; create and push it before publishing"; exit 1
          fi
          # The version stamped into binaries must equal the tag; source csproj/psd1 are
          # rewritten from the tag later, so the tag is the single authority.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag at $sha"

  build-binaries:
    needs: release-tag
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
            archive: win-x64
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
            archive: linux-x64
          - os: macos-latest
            rid: osx-arm64
            ext: ""
            archive: osx-arm64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # AOT publish is gated by /warnaserror per T11 acceptance: any AOT
      # warning (trimming, reflection, generic ILC fallback) must fail the
      # release build, not slip through as a runtime breakage on a customer
      # platform. The launcher is the only AOT-published binary; the host is
      # non-AOT (Microsoft.PowerShell.SDK is not AOT-compatible) and is
      # published self-contained without warnaserror.
      #
      # /p:Version stamps the release into both binaries. The csproj <Version> is only patched
      # in the `publish` job (for NuGet), so every archive used to report the stale csproj
      # value: a v0.11.5 zip printed "ps-bash, version 0.10.19" (GH #7). The smoke step below
      # now fails the release if `--version` disagrees with the tag.
      - name: Publish AOT launcher binary
        run: dotnet publish src/PsBash.Shell -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishAot=true /p:StripSymbols=true /p:Version=${{ needs.release-tag.outputs.version }} /warnaserror -o ./publish/launcher

      # Host is non-AOT — Microsoft.PowerShell.SDK is not AOT-compatible.
      # Self-contained so the SDK runtime assets ship inside the host folder.
      - name: Publish ps-bash-host binary
        run: dotnet publish src/PsBash.Host -c Release -r ${{ matrix.rid }} --self-contained true /p:Version=${{ needs.release-tag.outputs.version }} -o ./publish/host

      - name: Package binary
        shell: pwsh
        run: |
          $version = '${{ needs.release-tag.outputs.tag }}'
          $name = "ps-bash-${version}-${{ matrix.archive }}"
          $stage = "./publish/stage"
          $dst = "./artifacts/${name}.zip"
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Stage launcher (single AOT exe) at archive root.
          Copy-Item "./publish/launcher/ps-bash${{ matrix.ext }}" $stage -Force
          # Stage host binary + its runtime assets (SMA, runtimes/, deps.json, ...)
          # alongside the launcher so the launcher can spawn ps-bash-host from the
          # same directory at runtime.
          Copy-Item -Path "./publish/host/*" -Destination $stage -Recurse -Force
          if ($IsWindows) {
            Compress-Archive -Path "$stage/*" -DestinationPath $dst -Force
          } else {
            $absDst = (Resolve-Path ./artifacts).Path + "/${name}.zip"
            Push-Location $stage
            try { zip -r $absDst . } finally { Pop-Location }
          }

      # Smoke the STAGED ARCHIVE before it can be uploaded. Every release from the
      # introduction of <PrivateAssets>all</PrivateAssets> on the Microsoft.PowerShell.SDK
      # reference up to v0.10.22 shipped a win-x64 zip with NO
      # System.Management.Automation.dll: 195 DLLs instead of 265, and every command failed
      # with "ps-bash-host did not accept connections within 20s" (exit 125). Nothing
      # noticed, because this job only ever built and zipped — it never RAN the result —
      # and the `publish` job does not `need:` this one, so PSGallery/NuGet shipped fine
      # while the GitHub archives were dead.
      #
      # Runs the archive exactly as a user would: spawn the launcher, which spawns the host
      # from the same directory, execute one command, and require the output. A structural
      # check on the host's own deps.json comes first so a packaging regression names its
      # cause instead of surfacing as an opaque connection timeout.
      #
      # See docs/bugs/publish-host-missing-sma.md.
      - name: Smoke-test staged archive
        shell: pwsh
        run: ./scripts/smoke-archive.ps1 -StageDir ./publish/stage -ExpectedVersion '${{ needs.release-tag.outputs.version }}'

      # Re-extract the ZIP the way an installer does and run it. The smoke above tests
      # the staging directory; this proves the archive itself is complete.
      - name: Smoke-test extracted archive
        shell: pwsh
        run: |
          $zip = (Get-ChildItem ./artifacts/*.zip | Select-Object -First 1).FullName
          $dir = Join-Path ([IO.Path]::GetTempPath()) "psbash-extract-$([guid]::NewGuid().ToString('N'))"
          # Expand-Archive drops Unix mode bits; unzip keeps what an installer would see.
          if ($IsWindows) { Expand-Archive -Path $zip -DestinationPath $dir }
          else { New-Item -ItemType Directory -Path $dir | Out-Null; unzip -q $zip -d $dir; if ($LASTEXITCODE -ne 0) { throw 'unzip failed' } }
          ./scripts/smoke-archive.ps1 -StageDir $dir -ExpectedVersion '${{ needs.release-tag.outputs.version }}'

      # Digest recorded here is verified byte-for-byte by the `release` job, so the bytes
      # that were tested are the bytes promoted. Assets are NOT uploaded to the release
      # here: that happens only after every gate passes.
      - name: Record archive digest
        shell: pwsh
        run: |
          foreach ($z in Get-ChildItem ./artifacts/*.zip) {
            $h = (Get-FileHash $z.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$($z.FullName).sha256" -Value "$h  $($z.Name)" -NoNewline
          }

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps-bash-${{ matrix.archive }}
          path: |
            ./artifacts/*.zip
            ./artifacts/*.sha256
          if-no-files-found: error

  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
      # Don't let one OS cancel the others — the publish gate needs every leg's
      # blocking steps (Pester + Core.Tests + Cmdlets.Tests) to report.
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Backstop only. Each non-blocking suite carries its own step-level
    # timeout-minutes so a slow/hung one is killed without cancelling the whole
    # leg (a job-level timeout cancels every step, even the already-passed gate).
    # 80: the macOS leg's blocking Differential run reached the old 30-minute step limit with no failing test.
    timeout-minutes: 80
    needs: release-tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build ps-bash binary
        shell: bash
        run: dotnet build src/PsBash.Shell -c Release

      # Build the host so tests that exercise the IPC path (Host.Tests,
      # Differential.Tests via AssertOracle) have ps-bash-host available.
      - name: Build ps-bash-host binary
        shell: bash
        run: dotnet build src/PsBash.Host -c Release

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      # The Pester host pwsh on GitHub runners is PowerShell 7.4 (.NET 8). A
      # net10.0 PsBash.Cmdlets.dll fails to load there with
      # "System.Runtime, Version=10.0.0.0 not found", which fails Pester
      # *discovery* (the psm1 imports the cmdlets binary). Build the net8.0
      # variant and stage it (plus its runtime deps) next to the manifest so the
      # psm1 probe loads the pwsh-matching assembly.
      - name: Stage PsBash.Cmdlets.dll for Pester (pwsh-matching TFM)
        shell: pwsh
        run: |
          dotnet build src/PsBash.Cmdlets/PsBash.Cmdlets.csproj -c Release --framework net8.0
          if ($LASTEXITCODE -ne 0) { throw "PsBash.Cmdlets net8.0 build failed" }
          $bin = "src/PsBash.Cmdlets/bin/Release/net8.0"
          foreach ($dll in @('PsBash.Cmdlets.dll', 'PsBash.Transpiler.dll', 'Parlot.dll')) {
            Copy-Item (Join-Path $bin $dll) src/PsBash.Module/ -Force
          }

      - name: Run Pester Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      # ── PsBash.Core.Tests (parser + emitter unit tests) ──────────────────────
      - name: Run PsBash.Core.Tests
        shell: bash
        run: |
          dotnet test src/PsBash.Core.Tests/PsBash.Core.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=core.trx" \
            --results-directory TestResults/core \
            --collect "XPlat Code Coverage"

      - name: Skip report — Core.Tests
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/skip-report.sh TestResults/core "Core.Tests (${{ matrix.os }})"

      # ── Install optional tools for OnCd integration tests ───────────────────
      # fnm: Node version manager used by fnm --use-on-cd tests.
      # Only installed on ubuntu-latest; tests skip gracefully on other platforms.
      - name: Install fnm (ubuntu-latest)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.fnm" --skip-shell
          echo "$HOME/.fnm" >> "$GITHUB_PATH"

      # ── PsBash.Cmdlets.Tests ─────────────────────────────────────────────────
      # BLOCKING (filesystem-security regressions such as tar containment live here).
      # --blame-hang-timeout and the step timeout bound a hang from process-spawning
      # fixtures: a hang now fails the release instead of being ignored.
      - name: Run PsBash.Cmdlets.Tests
        timeout-minutes: 10
        shell: bash
        run: |
          dotnet test src/PsBash.Cmdlets.Tests/PsBash.Cmdlets.Tests.csproj \
            --configuration Release \
            --blame-hang-timeout 180s \
            --logger "trx;LogFileName=cmdlets.trx" \
            --results-directory TestResults/cmdlets \
            --collect "XPlat Code Coverage"

      # ── PsBash.Host.Tests (IPC, cancellation, environment isolation, lifecycle) ──
      - name: Run PsBash.Host.Tests
        timeout-minutes: 12
        shell: bash
        run: |
          dotnet test src/PsBash.Host.Tests/PsBash.Host.Tests.csproj \
            --configuration Release \
            --blame-hang-timeout 180s \
            --logger "trx;LogFileName=host.trx" \
            --results-directory TestResults/host

      - name: Skip report — Cmdlets.Tests
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/skip-report.sh TestResults/cmdlets "Cmdlets.Tests (${{ matrix.os }})"

      # Short safety/recovery scenarios block every platform. The broader PTY/timing
      # suite below stays advisory while its recorded failures are triaged.
      - name: Run blocking shell safety and recovery tests
        timeout-minutes: 5
        shell: bash
        run: |
          dotnet test src/PsBash.Shell.Tests/PsBash.Shell.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~ShellArgsTests|FullyQualifiedName~UnsupportedLauncherOption|FullyQualifiedName~MissingCommandArgument|FullyQualifiedName~UnsupportedSafetyOption_DoesNotFallBack|FullyQualifiedName~HistoryDirectoryOccupiedByFile|FullyQualifiedName~TerminalBrokerBackpressureTests|FullyQualifiedName~QuotedErrexitOption|FullyQualifiedName~TruncatedGzipInput|FullyQualifiedName~CompleteConcatenatedGzipMembers' \
            --blame-hang-timeout 180s \
            --logger "trx;LogFileName=shell-safety.trx" \
            --results-directory TestResults/shell-safety

      # ── PsBash.Shell.Tests (requires binary built above) ────────────────────
      - name: Run PsBash.Shell.Tests
        # Advisory until the Linux interactive/PTY failures (prompt stalls after 1 char, host exit
        # 125 on a 50k-term test chain) are root-caused; see docs/known-issues.md.
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          dotnet test src/PsBash.Shell.Tests/PsBash.Shell.Tests.csproj \
            --configuration Release \
            --blame-hang-timeout 180s \
            --logger "trx;LogFileName=shell.trx" \
            --results-directory TestResults/shell \
            --collect "XPlat Code Coverage"

      - name: Skip report — Shell.Tests
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/skip-report.sh TestResults/shell "Shell.Tests (${{ matrix.os }})"

      # ── PsBash.Differential.Tests ────────────────────────────────────────────
      # Blocking cassette replay on every OS: recorded Bash results vs this build.
      # Live-only cases remain the separate cassette-audit workflow's job.
      - name: Run PsBash.Differential.Tests
        timeout-minutes: 45
        shell: bash
        run: |
          export UPDATE_GOLDENS=0 PSBASH_ORACLE_LIVE=0 PSBASH_ORACLE_RECORD=0
          echo "Platform: $RUNNER_OS — replaying recorded Bash oracle against this build"
          dotnet test src/PsBash.Differential.Tests/PsBash.Differential.Tests.csproj \
            --configuration Release \
            --blame-hang-timeout 180s \
            --logger "trx;LogFileName=differential.trx" \
            --results-directory TestResults/differential \
            --collect "XPlat Code Coverage"

      - name: Skip report — Differential.Tests
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/skip-report.sh TestResults/differential "Differential.Tests (${{ matrix.os }})"

      # ── Quarantine report ────────────────────────────────────────────────────
      - name: Quarantine report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Quarantined tests ===" >&2
          count=$(dotnet test \
            --filter "Quarantined=notEmpty" \
            --configuration Release \
            --no-build \
            --list-tests 2>/dev/null \
            | grep -c "^\s*" || echo "0")
          echo "Quarantined test count: ${count}" >&2

      # ── Diff-coverage gate (PRs touching PsBash.Core or PsBash.Module) ──────
      - name: Diff-coverage gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Collect one representative coverage XML for the gate check.
          # Coverlet places coverage.cobertura.xml under TestResults/<guid>/
          xml=$(find TestResults -name "coverage.cobertura.xml" 2>/dev/null | head -1 || true)
          if [[ -n "$xml" ]]; then
            bash scripts/diff-coverage.sh "$xml" "origin/${{ github.base_ref }}" || {
              echo "::warning::Diff-coverage gate failed — see diff-coverage.sh output above"
            }
          else
            echo "::warning::No coverage XML found; skipping diff-coverage gate"
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            src/PsBash.Differential.Tests/Goldens/*.received.txt
          if-no-files-found: ignore

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  publish:
    # Gate on BOTH the test suite AND the AOT binary build. Gating on `test`
    # alone let releases ship to PSGallery/NuGet while the win-x64/linux/osx zips
    # were missing (v0.10.15/16). A release that can't produce its binaries must
    # not publish the module either.
    needs: [release-tag, test, build-binaries]
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.sha }}

      - name: Set version from release tag
        shell: pwsh
        run: |
          $version = '${{ needs.release-tag.outputs.tag }}' -replace '^v', ''
          Write-Host "Publishing version: $version"
          $manifest = Get-Content ./src/PsBash.Module/PsBash.psd1 -Raw
          $manifest = $manifest -replace "ModuleVersion = '.*'", "ModuleVersion = '$version'"
          Set-Content ./src/PsBash.Module/PsBash.psd1 -Value $manifest
          # Verify
          $data = Import-PowerShellDataFile ./src/PsBash.Module/PsBash.psd1
          Write-Host "Manifest version: $($data.ModuleVersion)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build the PsBash.Cmdlets binary so the published PSGallery package
      # contains an actual PsBash.Cmdlets.dll. It is bundled INSIDE the ./PsBash
      # module package below (the psm1 probes $PSScriptRoot/PsBash.Cmdlets.dll);
      # without the real DLL every migrated command (ls/cat/grep…) is missing.
      - name: Build PsBash.Cmdlets binary
        shell: pwsh
        run: |
          dotnet build ./src/PsBash.Cmdlets/PsBash.Cmdlets.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "PsBash.Cmdlets build failed" }

      - name: Prepare module directories
        shell: pwsh
        run: |
          # Resolve the built PsBash.Cmdlets runtime DLLs once. Sort descending so a netN.0
          # variant that loads on every supported pwsh (net8.0 loads on the net10 runtime) wins.
          # Graph is Core -> Cmdlets -> Transpiler, so Core.dll is NOT needed here.
          $cmdletsBin = Get-ChildItem -Path ./src/PsBash.Cmdlets/bin/Release -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cmdletsBin) { throw "PsBash.Cmdlets build output not found under bin/Release/" }
          $runtimeDlls = foreach ($dll in @('PsBash.Cmdlets.dll', 'PsBash.Transpiler.dll', 'Parlot.dll')) {
            $src = Join-Path $cmdletsBin.FullName $dll
            if (-not (Test-Path $src)) { throw "Expected runtime dependency $dll not found at $src" }
            $src
          }

          # PsBash package = the script module + the bundled binary cmdlets. The DLLs MUST ship
          # inside ./PsBash so `Install-Module PsBash` is self-contained: the psm1 probes
          # $PSScriptRoot/PsBash.Cmdlets.dll, and without it every migrated command (ls/cat/grep…)
          # plus the BashRuntime helpers are missing. (Regression: ModuleInstallLayoutTests.)
          Copy-Item -Path ./src/PsBash.Module -Destination ./PsBash -Recurse
          Copy-Item -Path $runtimeDlls -Destination ./PsBash/ -Force
          Write-Host "Staged ./PsBash contents:"
          Get-ChildItem ./PsBash | Format-Table Name, Length
          try { Test-ModuleManifest -Path ./PsBash/PsBash.psd1 | Out-Null }
          catch { Write-Warning "Test-ModuleManifest (PsBash) non-fatal: $($_.Exception.Message)" }

      # Fail the job on a genuine PSGallery publish failure — a silent
      # continue-on-error here reported false green while the module never
      # reached PSGallery. Still idempotent: the version-already-live check below
      # returns early, so re-runs after a partial publish succeed without erroring.
      - name: Publish PsBash to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $v = (Import-PowerShellDataFile ./PsBash/PsBash.psd1).ModuleVersion
          if (Find-Module PsBash -RequiredVersion $v -Repository PSGallery -ErrorAction SilentlyContinue) {
            Write-Host "PsBash $v already on PSGallery — skipping."; return
          }
          Publish-Module -Path ./PsBash -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -Verbose

      # NOTE: PsBash.Cmdlets is NOT published as a standalone PSGallery module.
      # Its DLL ships bundled inside the ./PsBash package above, so a separate
      # module is redundant — and its publish never actually succeeded (the step
      # reported a false green while silently exiting 1). Removed deliberately.

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Pack and publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $version = '${{ needs.release-tag.outputs.tag }}' -replace '^v', ''
          # Sync BOTH package versions to the release. PsBash.Core takes a
          # ProjectReference to PsBash.Transpiler, so Core's nupkg declares a
          # dependency on PsBash.Transpiler at this version — both MUST be packed
          # and pushed together or consumers hit NU1101 on restore.
          foreach ($proj in @(
              './src/PsBash.Transpiler/PsBash.Transpiler.csproj',
              './src/PsBash.Core/PsBash.Core.csproj')) {
            $csproj = Get-Content $proj -Raw
            $csproj = $csproj -replace '<Version>.*</Version>', "<Version>$version</Version>"
            Set-Content $proj -Value $csproj
            Write-Host "$proj version set to: $version"
          }

          # Pack Transpiler first so Core's dependency resolves to the freshly
          # versioned package; the push glob then uploads both.
          dotnet pack ./src/PsBash.Transpiler/PsBash.Transpiler.csproj -c Release -o ./nuget-out
          dotnet pack ./src/PsBash.Core/PsBash.Core.csproj -c Release -o ./nuget-out
          dotnet nuget push ./nuget-out/*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

  # The ONLY job that makes binaries discoverable. It runs after every build and test
  # gate has passed, verifies each archive's digest against the one recorded when it was
  # smoke-tested, and creates the release as a draft, uploads all assets, then publishes
  # it, so `/releases/latest` never sees a partial or unqualified release. If any gate
  # fails this job never runs and the previous release stays "latest".
  release:
    needs: [release-tag, test, build-binaries]
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: ps-bash-*
          merge-multiple: true

      - name: Verify digests of the tested archives
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          test "$(ls ps-bash-*-*.zip | wc -l)" -eq 3 || { echo "::error::expected 3 platform archives"; ls; exit 1; }
          for f in ps-bash-*.zip; do
            expected=$(cut -d' ' -f1 "$f.sha256")
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            [ "$expected" = "$actual" ] || { echo "::error::$f digest changed after testing"; exit 1; }
          done

      - name: Promote release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$state" = false ]; then
              echo "::error::release $TAG is already public; refusing to replace its assets"; exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          fi
          gh release upload "$TAG" staged/*.zip staged/*.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
