name: Single Test (manual)

# Fast-iteration workflow for CI triage.
#
# Methodology context (#24): the full Build matrix runs 9 jobs and takes ~20m.
# When investigating a specific failing test, that loop is too slow. This
# workflow accepts a filter expression and an optional single-OS target so an
# investigator can re-run one test per platform in ~3-5m.
#
# Usage:
#   gh workflow run single-test.yml \
#     -f filter="FullyQualifiedName~Differential_Pipe_ExitCode" \
#     -f platform="linux"
#
#   gh workflow run single-test.yml \
#     -f filter="FullyQualifiedName~InvokeBashTputCommandTests" \
#     -f platform="all"
#
# Filter syntax is dotnet test --filter. Quoting note from Directive 13:
# unquoted `|` becomes a shell pipe and hangs the runner — pass filters
# verbatim, no shell pipes.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'dotnet test --filter expression (e.g. FullyQualifiedName~MyTest)'
        required: true
        type: string
      platform:
        description: 'Platform to run on'
        required: true
        default: 'linux'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      project:
        description: 'Optional: limit to one test project (e.g. src/PsBash.Differential.Tests). Empty = all projects.'
        required: false
        type: string
        default: ''

concurrency:
  group: single-test-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Compute the run matrix from the `platform` input here. A job-level `if` CANNOT
  # filter the matrix per platform: the `matrix` context does not exist until the
  # matrix is expanded, which is after the job `if` is evaluated. The old
  # `if: inputs.platform == matrix.label` referenced `matrix` in the job `if`, which
  # fails GitHub's workflow schema validation — surfacing as a "workflow file issue"
  # startup-failure run on every push (the workflow is manual-only, but invalid files
  # are reported against the push). Emitting the matrix from this setup job and
  # consuming it via needs + fromJSON keeps "run only the selected platform" while
  # staying schema-valid (verified with actionlint).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          all='[{"os":"windows-latest","rid":"win-x64","label":"windows"},{"os":"ubuntu-latest","rid":"linux-x64","label":"linux"},{"os":"macos-latest","rid":"osx-arm64","label":"macos"}]'
          if [ "$PLATFORM" = "all" ] || [ -z "$PLATFORM" ]; then
            sel="$all"
          else
            sel=$(printf '%s' "$all" | jq -c --arg p "$PLATFORM" '[.[] | select(.label == $p)]')
          fi
          printf 'matrix={"include":%s}\n' "$sel" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # --blame-hang-timeout 2m is tighter than the main Build workflow's 5m;
      # single-test runs target one failure at a time, so a hang is itself
      # diagnostic and the runner should bail fast.
      - name: Run filtered test
        timeout-minutes: 10
        run: |
          dotnet test ${{ inputs.project }} --no-build -c Release \
            --filter "${{ inputs.filter }}" \
            --blame-hang-timeout 2m \
            --blame-hang-dump-type none \
            --logger "console;verbosity=detailed"
        shell: bash

      # Upload TestResults/ on failure so the investigator can see hang dumps
      # and trx files — Directive 9 (observability on failure).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: single-test-results-${{ matrix.label }}-${{ github.run_id }}
          path: |
            **/TestResults/**
            **/*.trx
          retention-days: 7
          if-no-files-found: ignore
